[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubinscssl"
version = "0.1.0"
description = "Cluster Scale Strong Lens simulation and analysis pipeline for Rubin"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "astropy",
    "pandas",
    "slsim",
    "tdpy @ git+https://github.com/tansudaylan/tdpy.git@35df1703c6b63d6a62f7d44b12cf5928b5d355ed",
]

[project.optional-dependencies]
plots = [
    "matplotlib",
    "corner",
    "bokeh",
]
dev = [
    "pytest",
    "ruff",
]
time-delays = [
    "pycs3>=3.0.4",
    "multiprocess>=0.70.16",
    "threadpoolctl",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
